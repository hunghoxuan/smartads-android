    <script>
            var data = getData();
            if (isEmpty(data)) {
                 data = [
                    {'url': 'file:///android_asset/images/default_image_1.png', 'description': '', 'title': ''},
                    {'url': 'file:///android_asset/images/default_image_2.jpg', 'description': '', 'title': ''},
                ];
            }

            //generate data
           var control = document.getElementById('slides-main');
           var html = '';
           var html1 = '';
           for (let i = 0; i < data.length; i++) {
                let content = `<div class="slide" data-index="{i}">
                                    <div class="abs-mask">
                                        <div class="slide-image" style="background-image: url({image})"></div>
                                    </div>
                                </div>`;
                let content1 = `<h2 class="slide-title slide" data-index="{i}"><a href="{url}">{description}</a></h2>`;
                content = content.replaceAll('{image}', data[i].url).replaceAll('{i}', i);
                content1 = content1.replaceAll('{url}', data[i].description).replaceAll('{i}', i).replaceAll('{description}', data[i].title);
                html += content;
                html1 += content1;
           }
           //Android.showMessage(html);
           document.getElementById('slides-main').innerHTML = html;
           document.getElementById('slides-aux').innerHTML = html1;

    </script>
